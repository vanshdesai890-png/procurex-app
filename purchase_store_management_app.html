<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>ProcureX — Live App</title>

<!-- PWA settings: Isse mobile mein asali app ki tarah dikhega -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#1a56db"/>

<style>
/* CSS remains same as original for consistency */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --p:#1a56db;--ps:#1e429f;--pa:#dbeafe;--pt:#1e3a5f;
  --s:#0891b2;--sa:#cffafe;
  --ok:#059669;--oka:#d1fae5;--okt:#064e3b;
  --warn:#d97706;--warna:#fef3c7;--warnt:#78350f;
  --err:#dc2626;--erra:#fee2e2;--errt:#7f1d1d;
  --bg:#ffffff;--bg2:#f9fafb;--bg3:#f3f4f6;
  --txt:#111827;--txt2:#6b7280;
  --bdr:rgba(0,0,0,0.1);--bdr2:rgba(0,0,0,0.18);
  --r:8px;--rl:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;
    --txt:#f3f4f6;--txt2:#9ca3af;
    --bdr:rgba(255,255,255,0.1);--bdr2:rgba(255,255,255,0.18);
    --pa:#1e3a5f;--pt:#bfdbfe;
    --oka:#064e3b;--okt:#a7f3d0;
    --warna:#78350f;--warnt:#fde68a;
    --erra:#7f1d1d;--errt:#fca5a5;
  }
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;color:var(--txt);background:var(--bg3)}
#app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;background:var(--bg3);position:relative;box-shadow:0 0 40px rgba(0,0,0,.15)}
.topbar{background:var(--bg);border-bottom:0.5px solid var(--bdr);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:56px}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-title{font-size:15px;font-weight:600;color:var(--txt)}
.topbar-sub{font-size:11px;color:var(--txt2);margin-top:1px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;cursor:pointer}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.bottomnav{background:var(--bg);border-top:0.5px solid var(--bdr);display:flex;padding:4px 0 calc(4px + env(safe-area-inset-bottom));flex-shrink:0}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:none;background:none;cursor:pointer;color:var(--txt2);font-size:10px;font-family:inherit;border-radius:var(--r);transition:.15s}
.navbtn i{font-size:22px}
.navbtn.active{color:var(--p)}
.screen{display:none}.screen.active{display:block}
.card{background:var(--bg);border:0.5px solid var(--bdr);border-radius:var(--rl);padding:14px;margin-bottom:10px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--bg);border:0.5px solid var(--bdr);border-radius:var(--r);padding:10px 12px}
.stat-num{font-size:22px;font-weight:700;margin-bottom:2px}
.stat-label{font-size:11px;color:var(--txt2)}
.stat.blue .stat-num{color:var(--p)}
.stat.green .stat-num{color:var(--ok)}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.badge.green{background:var(--oka);color:var(--okt)}
.badge.amber{background:var(--warna);color:var(--warnt)}
.badge.red{background:var(--erra);color:var(--errt)}
.badge.blue{background:var(--pa);color:var(--pt)}
.list-item{background:var(--bg);border:0.5px solid var(--bdr);border-radius:var(--r);padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.section-header{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px;padding:0 2px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--txt2);margin-bottom:4px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:0.5px solid var(--bdr2);border-radius:var(--r);background:var(--bg);color:var(--txt);font-size:13px;outline:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:var(--r);border:0.5px solid var(--bdr2);background:var(--bg);color:var(--txt);font-size:13px;cursor:pointer;font-weight:500;transition:.15s;justify-content:center}
.btn.primary{background:var(--p);color:#fff;border-color:var(--p)}
.btn.full{width:100%}
.alert{border-radius:var(--r);padding:9px 12px;margin-bottom:8px;font-size:12px;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.alert.info{background:var(--pa);color:var(--pt)}
.tabs{display:flex;gap:3px;margin-bottom:12px;background:var(--bg2);border-radius:var(--r);padding:3px;border:0.5px solid var(--bdr)}
.tab{flex:1;text-align:center;padding:6px 4px;border-radius:calc(var(--r) - 2px);font-size:12px;cursor:pointer;color:var(--txt2);border:none;background:none}
.tab.active{background:var(--bg);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.divider{height:0.5px;background:var(--bdr);margin:10px 0}
#toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;opacity:0;transition:.3s;pointer-events:none;z-index:200}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 100px);padding:24px}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
</head>
<body>

<div id="app">
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-left">
      <div style="font-size:20px">🏭</div>
      <div>
        <div class="topbar-title">ProcureX</div>
        <div class="topbar-sub" id="status-text">Production Store</div>
      </div>
    </div>
    <div class="avatar" id="user-circle">PX</div>
  </div>

  <div class="content" id="main-scroll">
    
    <!-- LOGIN SCREEN -->
    <div class="screen active" id="screen-login">
      <div class="login-wrap">
        <div style="font-size:50px;margin-bottom:10px">🏭</div>
        <h2 style="margin-bottom:5px">ProcureX Live</h2>
        <p style="color:var(--txt2);margin-bottom:30px;text-align:center">Factory Store Management System</p>
        
        <div class="field" style="width:100%;max-width:300px">
          <label>Mobile Number</label>
          <input type="text" value="+91 98765 43210"/>
        </div>
        <button class="btn primary full" style="max-width:300px" onclick="doLogin()">
          <i class="ti ti-login"></i> Login Karein
        </button>
        <p style="font-size:11px;color:var(--txt2);margin-top:15px">Demo version - No OTP required</p>
      </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div class="screen" id="screen-dashboard">
      <div class="section-header">Live Statistics</div>
      <div class="stat-grid">
        <div class="stat blue">
          <div class="stat-num">12</div>
          <div class="stat-label">Pending Indents</div>
        </div>
        <div class="stat green">
          <div class="stat-num">₹18.2L</div>
          <div class="stat-label">Stock Value</div>
        </div>
      </div>
      
      <div class="card">
        <div style="font-weight:600;margin-bottom:10px">Quick Actions</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <button class="btn" onclick="navigate('indent')"><i class="ti ti-file-plus"></i> New Indent</button>
          <button class="btn" onclick="navigate('store')"><i class="ti ti-building-warehouse"></i> Stock Check</button>
        </div>
      </div>
    </div>

    <!-- INDENT SCREEN -->
    <div class="screen" id="screen-indent">
      <div class="tabs">
        <button class="tab active" id="tab-list">History</button>
        <button class="tab" id="tab-new" onclick="showNewIndent()">New Indent</button>
      </div>
      <div id="indent-content">
        <div class="list-item">
          <div>
            <div style="font-weight:600">IND-2026-0342</div>
            <div style="font-size:11px;color:var(--txt2)">MS Flat Bar · 200 Kg</div>
          </div>
          <span class="badge amber">Pending</span>
        </div>
      </div>
    </div>

  </div><!-- end content -->

  <!-- Bottom Nav -->
  <div class="bottomnav" id="bot-nav" style="display:none">
    <button class="navbtn active" onclick="navigate('dashboard')"><i class="ti ti-smart-home"></i><span>Home</span></button>
    <button class="navbtn" onclick="navigate('indent')"><i class="ti ti-file-text"></i><span>Indents</span></button>
    <button class="navbtn" onclick="navigate('store')"><i class="ti ti-building-warehouse"></i><span>Store</span></button>
    <button class="navbtn" onclick="navigate('profile')"><i class="ti ti-user"></i><span>Profile</span></button>
  </div>

  <div id="toast">Sandesh bheja gaya!</div>
</div>

<script>
  function navigate(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + screenId).classList.add('active');
    
    if(screenId === 'login') {
      document.getElementById('bot-nav').style.display = 'none';
    } else {
      document.getElementById('bot-nav').style.display = 'flex';
    }
  }

  function doLogin() {
    showToast("Login Safal Hua!");
    navigate('dashboard');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // Handle back button for PWA feel
  window.addEventListener('popstate', function() {
    navigate('dashboard');
  });
</script>

</body>
</html>
